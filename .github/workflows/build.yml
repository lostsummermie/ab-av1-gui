name: Build Tauri App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 核心：允许机器人向仓库写入内容（也就是创建 Release）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # 标准发布动作
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 自动打标签（例如 v0.1.0）
          releaseName: 'ab-av1-gui v__VERSION__' # Release 的标题
          releaseBody: '全新的 Windows 安装包。' # 说明文字
          releaseDraft: false # false 表示正式发布，不藏着掖着
          prerelease: false
